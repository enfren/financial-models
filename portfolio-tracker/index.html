<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.5 -apple-system, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px 16px; }
  .card .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .card .sub { font-size: 11px; color: #666; }
  .pos { color: #27ae60; } .neg { color: #c0392b; }
  .section { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
  .section h2 { font-size: 14px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: right; padding: 6px 8px; border-bottom: 2px solid #ddd; font-weight: 600; }
  th:first-child { text-align: left; }
  td { padding: 5px 8px; text-align: right; border-bottom: 1px solid #f0f0f0; }
  td:first-child { text-align: left; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .add-row input, .add-row select { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
  .add-row button { padding: 5px 14px; background: #4a90d9; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .add-row button:hover { background: #357abd; }
  .allocation-bar { display: flex; height: 24px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .allocation-bar div { display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <h1>Investment Portfolio Tracker</h1>
  <div class="cards" id="summaryCards"></div>
  <div class="section">
    <h2>Allocation</h2>
    <div class="allocation-bar" id="allocBar"></div>
  </div>
  <div class="section">
    <h2>Holdings</h2>
    <table id="holdingsTable"></table>
  </div>
  <div class="section">
    <h2>Transactions</h2>
    <table id="txTable"></table>
    <div class="add-row">
      <input type="date" id="txDate" value="2026-11-09">
      <select id="txType"><option value="buy">Buy</option><option value="sell">Sell</option><option value="dividend">Dividend</option></select>
      <input type="text" id="txTicker" placeholder="Ticker" style="width:70px">
      <input type="number" id="txQty" placeholder="Qty" step="any" style="width:70px">
      <input type="number" id="txPrice" placeholder="Price" step="any" style="width:80px">
      <button onclick="addTx()">Add</button>
    </div>
  </div>
</div>

<script>
// XIRR via Newton-Raphson with bisection fallback
function xirr(flows) {
  if (flows.length < 2) return NaN;
  const days = (a, b) => (b - a) / (1000 * 60 * 60 * 24);
  const npv = (r) => flows.reduce((s, f) => s + f.amount / Math.pow(1 + r, days(flows[0].date, f.date) / 365), 0);
  const dnpv = (r) => flows.reduce((s, f) => s - (days(flows[0].date, f.date) / 365) * f.amount / Math.pow(1 + r, days(flows[0].date, f.date) / 365 + 1), 0);

  // Bisection fallback
  let lo = -0.99, hi = 10;
  if (npv(lo) * npv(hi) > 0) return NaN;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    if (Math.abs(npv(mid)) < 1e-9) return mid;
    if (npv(lo) * npv(mid) < 0) hi = mid; else lo = mid;
  }
  return (lo + hi) / 2;
}

// State
let holdings = [
  { ticker: 'AAPL', shares: 50, avgCost: 178.20, current: 232.45 },
  { ticker: 'MSFT', shares: 25, avgCost: 412.00, current: 448.30 },
  { ticker: 'GOOGL', shares: 30, avgCost: 142.50, current: 178.12 },
  { ticker: 'VXUS', shares: 100, avgCost: 58.30, current: 64.75 },
  { ticker: 'BND', shares: 200, avgCost: 72.10, current: 74.85 },
];

let transactions = [
  { date: '2025-01-15', type: 'buy', ticker: 'AAPL', qty: 20, price: 185.00 },
  { date: '2025-03-01', type: 'buy', ticker: 'AAPL', qty: 30, price: 172.50 },
  { date: '2025-06-15', type: 'buy', ticker: 'MSFT', qty: 25, price: 412.00 },
  { date: '2025-09-01', type: 'buy', ticker: 'GOOGL', qty: 30, price: 142.50 },
  { date: '2025-11-15', type: 'buy', ticker: 'VXUS', qty: 100, price: 58.30 },
  { date: '2026-01-15', type: 'buy', ticker: 'BND', qty: 200, price: 72.10 },
  { date: '2026-03-20', type: 'dividend', ticker: 'AAPL', qty: 0, price: 2.00 },
  { date: '2026-06-20', type: 'dividend', ticker: 'MSFT', qty: 0, price: 3.32 },
];

function render() {
  const totalValue = holdings.reduce((s, h) => s + h.shares * h.current, 0);
  const totalCost = holdings.reduce((s, h) => s + h.shares * h.avgCost, 0);
  const totalPL = totalValue - totalCost;
  const totalPLPct = (totalPL / totalCost) * 100;

  // Build cash flows for XIRR
  const flows = transactions.map(t => ({
    date: new Date(t.date),
    amount: t.type === 'buy' ? -t.qty * t.price : t.type === 'sell' ? t.qty * t.price : t.price * 100
  }));
  // Add current portfolio value as final inflow
  flows.push({ date: new Date('2026-11-09'), amount: totalValue });
  const xirrVal = xirr(flows);

  const colors = ['#4a90d9','#e74c3c','#2ecc71','#f39c12','#9b59b6'];
  const allocHtml = holdings.map((h, i) => {
    const pct = (h.shares * h.current / totalValue) * 100;
    return `<div style="width:${pct}%;background:${colors[i%5]}" title="${h.ticker} ${pct.toFixed(1)}%">${pct > 8 ? h.ticker : ''}</div>`;
  }).join('');

  document.getElementById('summaryCards').innerHTML = `
    <div class="card"><div class="label">Portfolio Value</div><div class="value">$${totalValue.toLocaleString(undefined,{maximumFractionDigits:0})}</div></div>
    <div class="card"><div class="label">Total Cost</div><div class="value">$${totalCost.toLocaleString(undefined,{maximumFractionDigits:0})}</div></div>
    <div class="card"><div class="label">Unrealized P&L</div><div class="value ${totalPL>=0?'pos':'neg'}">${totalPL>=0?'+':''}$${totalPL.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">${totalPLPct>=0?'+':''}${totalPLPct.toFixed(1)}%</div></div>
    <div class="card"><div class="label">XIRR</div><div class="value ${xirrVal>=0?'pos':'neg'}">${(xirrVal*100).toFixed(1)}%</div><div class="sub">Annualized</div></div>`;

  document.getElementById('allocBar').innerHTML = allocHtml;

  document.getElementById('holdingsTable').innerHTML = `<tr><th>Ticker</th><th>Shares</th><th>Avg Cost</th><th>Current</th><th>Value</th><th>P&L</th><th>P&L %</th></tr>` +
    holdings.map(h => {
      const v = h.shares * h.current, c = h.shares * h.avgCost, pl = v - c, plp = pl/c*100;
      return `<tr><td>${h.ticker}</td><td>${h.shares}</td><td>$${h.avgCost.toFixed(2)}</td><td>$${h.current.toFixed(2)}</td><td>$${v.toLocaleString()}</td><td class="${pl>=0?'pos':'neg'}">${pl>=0?'+':''}$${pl.toLocaleString()}</td><td class="${pl>=0?'pos':'neg'}">${plp>=0?'+':''}${plp.toFixed(1)}%</td></tr>`;
    }).join('');

  document.getElementById('txTable').innerHTML = `<tr><th>Date</th><th>Type</th><th>Ticker</th><th>Qty</th><th>Price</th><th>Amount</th></tr>` +
    transactions.map(t => {
      const amt = t.type === 'dividend' ? t.price * 100 : t.qty * t.price;
      return `<tr><td>${t.date}</td><td>${t.type}</td><td>${t.ticker}</td><td>${t.qty||'—'}</td><td>$${t.price.toFixed(2)}</td><td>$${amt.toLocaleString()}</td></tr>`;
    }).join('');
}

function addTx() {
  const date = document.getElementById('txDate').value;
  const type = document.getElementById('txType').value;
  const ticker = document.getElementById('txTicker').value.toUpperCase();
  const qty = parseFloat(document.getElementById('txQty').value) || 0;
  const price = parseFloat(document.getElementById('txPrice').value) || 0;
  if (!ticker || !price) return;
  transactions.push({ date, type, ticker, qty, price });
  // Update holdings
  const h = holdings.find(x => x.ticker === ticker);
  if (h && type === 'buy') {
    h.avgCost = (h.shares * h.avgCost + qty * price) / (h.shares + qty);
    h.shares += qty;
  } else if (h && type === 'sell') {
    h.shares -= qty;
  } else if (type === 'buy' && !h) {
    holdings.push({ ticker, shares: qty, avgCost: price, current: price });
  }
  document.getElementById('txTicker').value = '';
  document.getElementById('txQty').value = '';
  document.getElementById('txPrice').value = '';
  render();
}

render();
</script>
</body>
</html>
